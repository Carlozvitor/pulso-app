<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#050506" />
    <meta name="color-scheme" content="dark" />
    <title>Sem conexão · Hub do Carlos</title>
    <!--
      Página servida pelo service worker quando o app é aberto sem internet.
      Grava capturas em localStorage["pulso:capturas-pendentes"], no mesmo formato de
      src/lib/tasks/capture-queue.ts — ao abrir o app com internet, elas vão para A fazer.
    -->
    <style>
      :root {
        --background: #050506;
        --surface: #0d0d0f;
        --border: #25262a;
        --foreground: #f4f4f5;
        --foreground-secondary: #a1a1aa;
        --foreground-subtle: #8a8a93;
        --muted-ui: #71717a;
        --primary: #4c5bff;
        --primary-soft: #8b95ff;
      }
      * { box-sizing: border-box; margin: 0; }
      [hidden] { display: none !important; }
      html { -webkit-text-size-adjust: 100%; }
      body {
        min-height: 100dvh;
        background: var(--background);
        color: var(--foreground);
        font: 1rem/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
        -webkit-tap-highlight-color: transparent;
      }
      main {
        max-width: 32rem;
        margin: 0 auto;
        padding: calc(env(safe-area-inset-top, 0px) + 3rem) 1rem calc(env(safe-area-inset-bottom, 0px) + 1.5rem);
        display: flex;
        flex-direction: column;
      }
      .mark { width: 2.5rem; height: 2.5rem; margin-bottom: 2.5rem; border-radius: 999px; border: 2px solid rgb(139 149 255 / 0.35); display: flex; align-items: center; justify-content: center; }
      .mark span { width: 1rem; height: 1rem; border-radius: 999px; background: var(--primary); }
      h1 { font-size: 1.625rem; line-height: 1.2; font-weight: 600; letter-spacing: -0.01em; }
      .lead { margin-top: 0.5rem; font-size: 0.875rem; color: var(--foreground-subtle); max-width: 22rem; }
      form { margin-top: 2rem; display: flex; flex-direction: column; gap: 0.75rem; }
      label { font-size: 0.875rem; color: var(--foreground-secondary); }
      input {
        height: 3rem; width: 100%; padding: 0 1rem;
        border: 1px solid var(--border); border-radius: 0.75rem;
        background: var(--surface); color: var(--foreground); font: inherit;
      }
      input::placeholder { color: var(--foreground-subtle); }
      input:focus-visible { outline: none; border-color: var(--primary-soft); }
      button {
        min-height: 3rem; width: 100%; border: 0; border-radius: 0.75rem;
        font: inherit; font-weight: 500; cursor: pointer;
        transition: transform 150ms ease-out, opacity 150ms ease-out;
      }
      button:active { transform: scale(0.98); }
      button:disabled { opacity: 0.5; }
      button:focus-visible { outline: 2px solid var(--primary-soft); outline-offset: 2px; }
      .primary { background: var(--primary); color: #fff; }
      .secondary { background: transparent; color: var(--foreground-secondary); margin-top: 0.5rem; }
      .saved { margin-top: 2rem; }
      .label { font-size: 0.75rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--foreground-subtle); }
      ul { list-style: none; padding: 0; margin-top: 0.5rem; }
      li { padding: 1rem 0; border-bottom: 1px solid var(--border); color: var(--foreground-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .note { margin-top: 0.75rem; font-size: 0.8125rem; color: var(--foreground-subtle); }
      .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
      .spacer { flex: 1; min-height: 2rem; }
      @media (prefers-reduced-motion: reduce) { button { transition: none; } button:active { transform: none; } }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true"><span></span></div>
      <h1>Sem conexão agora.</h1>
      <p class="lead">Quando a internet voltar, o Hub abre sozinho. Enquanto isso, dá para anotar o que não pode esquecer.</p>

      <form id="capture" autocomplete="off">
        <label for="title">O que você precisa fazer?</label>
        <input id="title" name="title" maxlength="500" enterkeyhint="done" placeholder="Ex.: Comprar remédio" />
        <button type="submit" class="primary" id="save" disabled>Guardar</button>
      </form>

      <section class="saved" id="saved" hidden aria-labelledby="saved-label">
        <p class="label" id="saved-label">Guardadas aqui</p>
        <ul id="list"></ul>
        <p class="note">Vão para A fazer quando a conexão voltar.</p>
      </section>

      <p class="note" id="unavailable" hidden>Este navegador não deixa guardar nada agora. Anote em outro lugar por enquanto.</p>

      <div class="spacer"></div>
      <button type="button" class="secondary" id="retry">Tentar de novo</button>
      <p role="status" id="status" class="sr-only"></p>
    </main>

    <script>
      (function () {
        var KEY = "pulso:capturas-pendentes";
        var input = document.getElementById("title");
        var save = document.getElementById("save");
        var saved = document.getElementById("saved");
        var list = document.getElementById("list");
        var status = document.getElementById("status");

        function storage() {
          try { return window.localStorage; } catch (e) { return null; }
        }

        function read() {
          try {
            var data = JSON.parse((storage() && storage().getItem(KEY)) || "[]");
            return Array.isArray(data) ? data : [];
          } catch (e) { return []; }
        }

        function uuid() {
          if (window.crypto && typeof crypto.randomUUID === "function") return crypto.randomUUID();
          var b = crypto.getRandomValues(new Uint8Array(16));
          b[6] = (b[6] & 0x0f) | 0x40;
          b[8] = (b[8] & 0x3f) | 0x80;
          var h = Array.prototype.map.call(b, function (x) { return ("0" + x.toString(16)).slice(-2); }).join("");
          return h.slice(0, 8) + "-" + h.slice(8, 12) + "-" + h.slice(12, 16) + "-" + h.slice(16, 20) + "-" + h.slice(20);
        }

        function render() {
          var items = read();
          list.textContent = "";
          items.forEach(function (item) {
            if (!item || typeof item.title !== "string") return;
            var li = document.createElement("li");
            li.textContent = item.title;
            list.appendChild(li);
          });
          saved.hidden = list.children.length === 0;
        }

        if (!storage()) {
          document.getElementById("capture").hidden = true;
          document.getElementById("unavailable").hidden = false;
        }

        input.addEventListener("input", function () {
          save.disabled = input.value.trim() === "";
        });

        document.getElementById("capture").addEventListener("submit", function (event) {
          event.preventDefault();
          var title = input.value.trim();
          if (!title) return;
          try {
            var items = read();
            items.push({ id: uuid(), title: title, capturedAt: new Date().toISOString() });
            storage().setItem(KEY, JSON.stringify(items));
            input.value = "";
            save.disabled = true;
            status.textContent = "Guardado.";
            render();
          } catch (e) {
            status.textContent = "Não deu para guardar. Tente de novo.";
          }
        });

        document.getElementById("retry").addEventListener("click", function () {
          location.reload();
        });

        // Internet de volta: recarrega e o app manda as capturas para a Inbox.
        window.addEventListener("online", function () {
          location.reload();
        });

        render();
      })();
    </script>
  </body>
</html>
